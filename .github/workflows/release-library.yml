name: Release KMP Library

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish KMP Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run KMP Unit Tests
        run: ./gradlew :shared:allTests

      - name: Assemble Shared KMP Artifacts
        run: ./gradlew :shared:assemble :shared:publishToMavenLocal

      - name: Package KMP Library Artifacts
        run: |
          mkdir -p release-artifacts
          find shared/build/outputs -name "*.aar" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          find shared/build/libs -name "*.jar" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          find shared/build/classes -name "*.klib" -exec cp {} release-artifacts/ \; 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}